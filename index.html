
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore | Tienda de Tecnología</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.jS" defer></script>
</head>
<body>
    <header>
        <h1>TechStore</h1>
        <p>Tu tienda de tecnología favorita</p>
        <button id="abrirCarrito">🛒 Carrito (<span id="cantidadCarrito">0</span>)</button>
    </header>

    <main>
        <section class="presentacion">
            <h2>Encuentra tu próxima tecnología</h2>
            <p>Explora nuestros productos y encuentra lo que necesitas.</p>
        </section>

        <section class="productos">
            <h2>Nuestros productos</h2>
            <div class="filtros">
                <button data-categoria="Todos">Todos</button>
                <button data-categoria="Computadoras">Computadoras</button>
                <button data-categoria="Teléfonos">Teléfonos</button>
                <button data-categoria="Accesorios">Accesorios</button>
            </div>
            <div class="catalogo" id="catalogo"></div>
        </section>
    </main>

    <dialog id="ventanaCarrito">
        <h2>Mi carrito</h2>
        <div id="listaCarrito"></div>
        <p>Total: $<span id="totalCarrito">0.00</span></p>
        <button id="cerrarCarrito">Cerrar</button>
    </dialog>

    <footer>
        <p>© 2026 TechStore - Proyecto de Desarrollo de Software</p>
    </footer>
</body>
</html>
